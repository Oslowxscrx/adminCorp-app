<div class="users-container">
  <div class="col-12">
    <!-- Título "Usuarios" -->
    <div class="row mb-4">
      <h1
        nz-typography
        nzTitle
        class="text-start mb-5"
        style="font-size: 2.5rem"
      >
        Usuarios
      </h1>
    </div>

    <!-- Botón Agregar -->
    <div class="row mb-3 d-flex justify-content-between">
      <div class="col-auto">
        <button
          nz-button
          nzType="primary"
          nzShape="round"
          (click)="openModal()"
        >
          Agregar
        </button>
      </div>
    </div>
    <br />
    <hr />

    <!-- Tabla de Usuarios -->
    <nz-table
      #basicTable
      [nzBordered]="true"
      [nzData]="usuarios"
      [nzSize]="'middle'"
      [nzFrontPagination]="false"
    >
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Rol a cumplir</th>
          <!-- <th>Fecha de Creación</th> -->
          <th>Editar</th>
          <th>Eliminar</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios; let i = index">
          <td>{{ usuario.id }}</td>
          <td>{{ usuario.username }}</td>
          <td>{{ usuario.firstName }}</td>
          <td>{{ usuario.lastName }}</td>
          <td>{{ usuario.role }}</td>
          <!-- <td>{{ usuario.createAt | date : "yyyy-MM-dd" }}</td> -->
          <td>
            <button
              nz-button
              nzType="primary"
              nzShape="circle"
              (click)="abrirModalParaEditar(usuario.id)"
            >
              <i nz-icon nzType="edit"></i>
            </button>
          </td>
          <td>
            <button
              nz-button
              nzDanger
              nzShape="circle"
              (click)="openModalDeleteUsuario(usuario)"
            >
              <i nz-icon nzType="delete"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>
</div>
